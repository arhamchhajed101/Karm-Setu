services:
  # 1. Backend Service (FastAPI)
  - type: web
    name: karmsetu-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && cd backend && python -m app.seed_data"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: "KarmSetu Backend"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./karmsetu.db"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # 2. Frontend Static Site (React / Vite)
  - type: web
    name: karmsetu-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: karmsetu-backend
          property: host
